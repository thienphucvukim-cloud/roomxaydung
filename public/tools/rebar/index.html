function kgm(d){return Math.PI*Math.pow(n(d)/1000,2)/4*n(state.settings.density||7850)}function calc(it,qty){const sh=shapeMap.get(it.shapeId),f=evalFormula(sh,it.params,it.diameter),L=it.manual&&n(it.manualLen)>0?n(it.manualLen):f.len,bars=n(it.bars)*n(qty),m=L/1000*bars,k=it.steelWeight?n(it.steelWeight):kgm(it.diameter);return {L,bars,m,kg:m*k,kgm:k,status:it.manual?'manual':f.status}}

function blackPathBBox(d,sh){
 let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;const re=/M(\d+) (\d+)h(\d+)v1h-\d+z/g;let m;
 while((m=re.exec(d||''))){const x=+m[1],y=+m[2],w=+m[3];minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x+w);maxY=Math.max(maxY,y+1)}
 if(!Number.isFinite(minX))return {x:0,y:0,w:sh.w||80,h:sh.h||30};return {x:minX,y:minY,w:Math.max(1,maxX-minX),h:Math.max(1,maxY-minY)};
}
function shapeInTable(g,it,x,y,w,h){
 const sh=shapeMap.get(it.shapeId);if(!sh)return;
 const cyan='#00ffff',white='#ffffff';
 // Kích thước này được đo theo tỷ lệ vùng hình của ảnh bản gốc.
 const iconW=Math.min(270,w*.54),iconH=Math.min(54,h*.72),ix=x+(w-iconW)/2,iy=y+(h-iconH)/2;
 const bb=blackPathBBox(sh.black,sh);const pad=1;
 const icon=svgEl('svg',{x:ix,y:iy,width:iconW,height:iconH,viewBox:`${bb.x-pad} ${bb.y-pad} ${bb.w+pad*2} ${bb.h+pad*2}`,preserveAspectRatio:'none'});
 icon.appendChild(svgEl('path',{d:sh.black,fill:cyan}));g.appendChild(icon);
 // Số kích thước đặt sát hình như bản CAD gốc. Bỏ các kích thước = 0.
 const p=it.params||{},left=ix-12,right=ix+iconW+12,top=iy+6,bottom=iy+iconH+15,cx=ix+iconW/2,cy=iy+iconH/2+7;
 const slot={
   L1:[left,cy,'end'],L2:[cx,top,'middle'],L3:[right,cy,'start'],L4:[cx,bottom,'middle'],
   L5:[ix+iconW*.25,top,'middle'],L6:[ix+iconW*.75,bottom,'middle'],L7:[left,iy+iconH*.72,'end'],
   M:[right,cy,'start'],R:[right,iy+13,'start'],D1:[cx-30,top,'middle'],D2:[cx+30,top,'middle'],
   b:[cx,bottom,'middle'],h:[left,cy,'end'],d:[right,cy,'start']
 };
 const used=new Set();for(const k of Object.keys(p)){
   if(k==='Chiều dài'||!Number.isFinite(Number(p[k]))||Number(p[k])===0)continue;
   let q=slot[k]||[[left,cy,'end'],[cx,top,'middle'],[right,cy,'start'],[cx,bottom,'middle']][used.size%4];
   let sig=q.join('|');if(used.has(sig))q=[q[0],q[1]+18,q[2]];used.add(sig);
   tx(g,q[0],q[1],String(round(p[k],0)),20,white,q[2]);
 }
 if(it.steelProfile){const profile=String(it.steelProfile).split('·').pop().trim();tx(g,x+w-10,y+h/2-4,profile,16,white,'end');tx(g,x+w-10,y+h/2+16,sh.name.toUpperCase(),13,white,'end')}
}
function drawSchedule(svg,sc,x,y){

 const visibleComponents=sc.components.filter(c=>c.items.length);const items=[];for(const c of visibleComponents)for(const it of c.items)items.push({c,it})

 for(const c of sc.components)for(const it of c.items){const z=calc(it,c.quantity),d=n(it.diameter),key=it.steelWeight?'THÉP HÌNH':byDiameter?('Φ'+d):(d<=10?'ĐƯỜNG KÍNH <= 10':d<=18?'10 < ĐƯỜNG KÍNH <= 18':'ĐƯỜNG KÍNH > 18'),a=sums.get(key)||{kg:0,m:0};a.kg+=z.kg;a.m+=z.m;sums.set(key,a)}

 tx(g,mid(cols[5],cols[7]),title+58,'SỐ LƯỢNG',27,yellow);ln(g,cols[5],title+96,cols[7],title+96,yellow);
 tx(g,mid(cols[5],cols[6]),title+134,'1',22,yellow);tx(g,mid(cols[5],cols[6]),title+171,'C.KIỆN',22,yellow);
 tx(g,mid(cols[6],cols[7]),title+158,'T.BỘ',24,yellow);
 tx(g,mid(cols[7],cols[8]),title+79,'TỔNG',25,yellow);tx(g,mid(cols[7],cols[8]),title+121,'CHIỀU DÀI',25,yellow);tx(g,mid(cols[7],cols[8]),title+162,'(m)',20,yellow);
 tx(g,mid(cols[8],cols[9]),title+79,'TỔNG',25,yellow);tx(g,mid(cols[8],cols[9]),title+121,'T.LƯỢNG',25,yellow);tx(g,mid(cols[8],cols[9]),title+162,'(Kg)',20,yellow);

 // Ô tên cấu kiện kéo dài qua toàn bộ thanh của cấu kiện.

 for(let i=0;i<items.length;i++){
   const {c,it}=items[i],ry=yy+i*row,next=items[i+1],sameNext=next&&c&&next.c?.id===c.id;
   ln(g,sameNext?cols[1]:0,ry+row,W,ry+row,yellow);if(!it)continue;

}
